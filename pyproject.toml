[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-disease-ai"
version = "1.0.0"
description = "Production-grade offline desktop AI application for grape leaf disease detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PlantDiseaseAI Team" }]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "tensorboard>=2.15.0",
    "opencv-python>=4.8.0",
    "albumentations>=1.3.1",
    "Pillow>=10.0.0",
    "PySide6>=6.6.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0.1",
    "imagehash>=4.3.1",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "mypy>=1.7.0", "ruff>=0.1.6"]

[project.scripts]
plantdisease-preprocess = "scripts.preprocess:main"
plantdisease-train = "scripts.train:main"
plantdisease-evaluate = "scripts.evaluate:main"
plantdisease-export = "scripts.export:main"
plantdisease-app = "scripts.run_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "configs*",
    "preprocessing*",
    "training*",
    "evaluation*",
    "exports*",
    "inference*",
    "desktop_app*",
    "utils*",
    "models*",
    "scripts*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
