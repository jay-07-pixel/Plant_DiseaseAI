# Auto-applied on Raspberry Pi (Linux ARM) at runtime.

device:
  preferred: cpu
  auto_select: true

desktop_app:
  camera:
    backend: auto
    index: 0
    device_path: null
    # Lower resolution reduces RAM use on Pi 4/5 and avoids Capture crashes.
    width: 480
    height: 360
    warmup_frames: 4

inference:
  # Grad-CAM enabled on Pi with memory-safe overlay sizing in code.
  enable_gradcam: true
  pi_gradcam_max_side: 512
